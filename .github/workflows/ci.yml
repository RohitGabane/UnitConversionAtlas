name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore UnitConversionApi.sln

      - name: Build solution
        run: dotnet build UnitConversionApi.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test UnitConversionApi.sln --no-build --configuration Release
